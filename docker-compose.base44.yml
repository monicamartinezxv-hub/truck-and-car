services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=truckcar
      - POSTGRES_PASSWORD=truckcar_dev_pw
      - POSTGRES_DB=truckcar
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckcar -d truckcar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://truckcar:truckcar_dev_pw@db:5432/truckcar
      - NEXT_TELEMETRY_DISABLED=1
    command: ["sh", "-ec", "npm install --no-audit --no-fund && node scripts/init-db.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgres://truckcar:truckcar_dev_pw@db:5432/truckcar
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    labels:
      base44.project: TRUCK AND CAR
      base44.kind: web
      base44.port: "3000"
    restart: on-failure

volumes:
  db_data:
  node_modules:
